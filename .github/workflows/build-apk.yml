name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repo'yu Kopyala
      uses: actions/checkout@v4

    - name: Node.js Kurulumu
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Capacitor ve Cordova CLI Kur
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android

    - name: Capacitor Projesi Başlat
      run: |
        npx cap init SantrancPro com.santranc.pro --web-dir .
        npx cap add android

    - name: HTML Dosyasını Web Klasörüne Taşı
      run: |
        mkdir -p android/app/src/main/assets/public
        cp index.html android/app/src/main/assets/public/index.html

    - name: Gradle ile APK Derle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: APK Dosyasını Kaydet (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: SantrancPro-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        

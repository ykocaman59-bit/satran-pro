<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sıfırdan Satranç Oyunu</title>
    
    <!-- CSS Dosyamız -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Chessboard.js CSS -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
</head>
<body>

    <div class="game-container">
        <h1>JavaScript Satranç</h1>
        <!-- Satranç Tahtasının Duracağı Alan -->
        <div id="board" style="width: 400px"></div>
        <div class="status-panel">
            <p>Durum: <span id="status">Oyun Başladı</span></p>
            <p>Sıra: <span id="turn">Beyaz</span></p>
            <button id="resetBtn">Yeniden Başlat</button>
        </div>
    </div>

    <!-- jQuery (Gerekli bağımlılık) -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    
    <!-- Chess.js (Satranç kuralları motoru) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    
    <!-- Chessboard.js (Görsel tahta) -->
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    
    <!-- Kendi Mantık Kodumuz -->
    <script src="script.js"></script>
</body>
</html>
